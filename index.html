<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OffFile - Your Files, Your Device</title>
    <meta
      name="description"
      content="OffFile: browser-based file tools. Merge PDFs, convert images, and more - 100% offline, no uploads, no tracking."
    />
    <meta name="theme-color" content="#ffe600" />

    <!-- Everything the page needs ships with it. No host other than 'self' is
         reachable, which is what makes the offline and no-tracking claims
         enforceable rather than a promise. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' blob:;
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        img-src 'self' data: blob:;
        media-src 'self' blob:;
        worker-src 'self' blob:;
        connect-src 'self' blob:;
        form-action 'none';
        frame-ancestors 'none';
        object-src 'none';
        base-uri 'self';
      "
    />

    <!-- vite-plugin-pwa injects the manifest link at build time. -->
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
