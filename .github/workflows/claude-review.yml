name: Claude review

# Copy to .github/workflows/claude-review.yml. Claude reviews every pull request with inline comments.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  review:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: sametsarikaya/workflows/.github/workflows/common-claude-review.yml@v1
    with:
      rules: common web
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
